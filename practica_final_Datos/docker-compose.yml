services:
  postgres:
    image: postgres:16-alpine
    container_name: practica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: practica_db
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d practica_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
